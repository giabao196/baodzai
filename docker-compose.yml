services:
  cloudphone-api:
    build: ./backend
    container_name: cloudphone-api
    environment:
      ANDROID_CONTAINER: cloudphone-android
      ANDROID_VNC_URL: http://android:6080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./android/apks:/data/apks
    depends_on:
      - android
    restart: unless-stopped

  android:
    image: budtmo/docker-android:emulator_13.0
    container_name: cloudphone-android
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      DEVICE: "Samsung Galaxy S10"
      EMULATOR_ARGS: "-no-boot-anim -no-window"
      WEB_VNC: "true"
      APPIUM: "false"
    shm_size: "2gb"
    mem_limit: "5g"
    cpus: "3"
    volumes:
      - android-data:/home/androidusr
      - ./android/apks:/tmp/apks
    ports:
      - "6080:6080"
      - "5555:5555"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cloudphone-web
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cloudphone-api
    restart: unless-stopped

volumes:
  android-data:
