<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>CloudPhone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>☁️ CloudPhone</h1>

        <div class="phone-card">

            <h2>Android Cloud Phone</h2>

            <p id="status">
                Đang kiểm tra...
            </p>

            <div class="buttons">

                <button onclick="startPhone()">
                    ▶ Start
                </button>

                <button onclick="restartPhone()">
                    ↻ Restart
                </button>

                <button onclick="stopPhone()">
                    ■ Stop
                </button>

            </div>

            <div class="screen">

                <div id="screen-message">
                    Android screen
                </div>

            </div>

        </div>

    </main>

    <script>

        const API = "/api";

        async function getStatus() {

            try {

                const response =
                    await fetch(`${API}/status`);

                const data =
                    await response.json();

                document.getElementById("status")
                    .textContent =
                    "Status: " + data.status;

            } catch (error) {

                document.getElementById("status")
                    .textContent =
                    "API chưa kết nối";

            }

        }


        async function startPhone() {

            await fetch(`${API}/start`, {
                method: "POST"
            });

            getStatus();

        }


        async function restartPhone() {

            await fetch(`${API}/restart`, {
                method: "POST"
            });

            getStatus();

        }


        async function stopPhone() {

            await fetch(`${API}/stop`, {
                method: "POST"
            });

            getStatus();

        }


        getStatus();

    </script>

</body>
</html>
